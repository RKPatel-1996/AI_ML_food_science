<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img"><rect width="1280" height="460" rx="22" fill="#f8fafc"/> <text x="46" y="55" font-family="Arial,Helvetica,sans-serif" font-size="29" fill="#20364c" font-weight="700" text-anchor="start">FROM FOOD RECORD TO NUTRIENT ESTIMATE</text><text x="46" y="84" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#556575" font-weight="400" text-anchor="start">Each stage adds information, assumptions or measurement error.</text><rect x="46" y="119" width="343" height="133" rx="16" fill="#eaf0f7" stroke="#d8e2ec" stroke-width="2"/><text x="66" y="152" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#117b78" font-weight="700" text-anchor="start">1  CAPTURE</text><text x="66" y="192" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#20364c" font-weight="700" text-anchor="start">Photo / food diary</text><text x="66" y="227" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#556575" font-weight="400" text-anchor="start">What was served or reported?</text><rect x="468" y="119" width="343" height="133" rx="16" fill="#e8f5f2" stroke="#d8e2ec" stroke-width="2"/><text x="488" y="152" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#117b78" font-weight="700" text-anchor="start">2  IDENTIFY</text><text x="488" y="192" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#20364c" font-weight="700" text-anchor="start">Food recognition</text><text x="488" y="227" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#556575" font-weight="400" text-anchor="start">Which foods are present?</text><rect x="890" y="119" width="343" height="133" rx="16" fill="#eaf0f7" stroke="#d8e2ec" stroke-width="2"/><text x="910" y="152" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#117b78" font-weight="700" text-anchor="start">3  QUANTIFY</text><text x="910" y="192" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#20364c" font-weight="700" text-anchor="start">Portion estimation</text><text x="910" y="227" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#556575" font-weight="400" text-anchor="start">How much was eaten?</text><rect x="890" y="292" width="343" height="133" rx="16" fill="#e8f5f2" stroke="#d8e2ec" stroke-width="2"/><text x="910" y="325" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#117b78" font-weight="700" text-anchor="start">4  MATCH</text><text x="910" y="365" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#20364c" font-weight="700" text-anchor="start">Composition database</text><text x="910" y="400" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#556575" font-weight="400" text-anchor="start">Which food / recipe entry?</text><rect x="468" y="292" width="343" height="133" rx="16" fill="#eaf0f7" stroke="#d8e2ec" stroke-width="2"/><text x="488" y="325" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#117b78" font-weight="700" text-anchor="start">5  CALCULATE</text><text x="488" y="365" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#20364c" font-weight="700" text-anchor="start">Nutrient arithmetic</text><text x="488" y="400" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#556575" font-weight="400" text-anchor="start">Amount × per-100-g value</text><rect x="46" y="292" width="343" height="133" rx="16" fill="#e8f5f2" stroke="#d8e2ec" stroke-width="2"/><text x="66" y="325" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#117b78" font-weight="700" text-anchor="start">6  VERIFY</text><text x="66" y="365" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#20364c" font-weight="700" text-anchor="start">Scientific review</text><text x="66" y="400" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#556575" font-weight="400" text-anchor="start">Compare with reliable evidence</text><line x1="417" y1="182" x2="441" y2="182" stroke="#117b78" stroke-width="4" stroke-linecap="round"/><path d="M432 173 L443 182 L432 191" fill="none" stroke="#117b78" stroke-width="4" stroke-linejoin="round"/><line x1="839" y1="182" x2="863" y2="182" stroke="#117b78" stroke-width="4" stroke-linecap="round"/><path d="M854 173 L865 182 L854 191" fill="none" stroke="#117b78" stroke-width="4" stroke-linejoin="round"/><line x1="1070" y1="259" x2="1070" y2="283" stroke="#117b78" stroke-width="4" stroke-linecap="round"/><path d="M1061 274 L1070 285 L1079 274" fill="none" stroke="#117b78" stroke-width="4"/><line x1="839" y1="357" x2="863" y2="357" stroke="#117b78" stroke-width="4" stroke-linecap="round"/><path d="M848 348 L837 357 L848 366" fill="none" stroke="#117b78" stroke-width="4" stroke-linejoin="round"/><line x1="417" y1="357" x2="441" y2="357" stroke="#117b78" stroke-width="4" stroke-linecap="round"/><path d="M426 348 L415 357 L426 366" fill="none" stroke="#117b78" stroke-width="4" stroke-linejoin="round"/></svg>