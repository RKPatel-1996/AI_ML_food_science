<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img"><rect x="0" y="0" width="1200" height="680" rx="24" fill="#ffffff"/><text x="600" y="64" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="#24344d" text-anchor="middle">FROM HEALTH DATA TO A LEARNING TASK</text><text x="600" y="103" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#5d6c81" text-anchor="middle">Data alone do not train a model: define what must be learned first.</text><rect x="45" y="162" width="235" height="328" rx="20" fill="#eaf3fb" stroke="#245e98" stroke-width="2"/><text x="61" y="198" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#245e98">STEP 1 · OBSERVE</text><text x="61" y="253" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#24344d">Participant records</text><rect x="60" y="292" width="205" height="48" rx="9" fill="#ffffff"/><text x="71" y="321" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#24344d">Age</text><rect x="60" y="352" width="205" height="48" rx="9" fill="#ffffff"/><text x="71" y="381" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#24344d">Reported dietary energy</text><rect x="60" y="412" width="205" height="48" rx="9" fill="#ffffff"/><text x="71" y="441" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#24344d">Measured BMI</text><rect x="337" y="162" width="235" height="328" rx="20" fill="#fff6e7" stroke="#a76a13" stroke-width="2"/><text x="353" y="198" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#a76a13">STEP 2 · DEFINE</text><text x="353" y="253" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#24344d">Scientific question</text><rect x="352" y="292" width="205" height="48" rx="9" fill="#ffffff"/><text x="363" y="321" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#24344d">Which variable is the target?</text><rect x="352" y="352" width="205" height="48" rx="9" fill="#ffffff"/><text x="363" y="381" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#24344d">Which inputs are available?</text><rect x="352" y="412" width="205" height="48" rx="9" fill="#ffffff"/><text x="363" y="441" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#24344d">Is prediction appropriate?</text><rect x="629" y="162" width="235" height="328" rx="20" fill="#eaf8f3" stroke="#17766d" stroke-width="2"/><text x="645" y="198" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#17766d">STEP 3 · LEARN</text><text x="645" y="253" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#24344d">Training examples</text><rect x="644" y="292" width="205" height="48" rx="9" fill="#ffffff"/><text x="655" y="321" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#24344d">Features + known labels</text><rect x="644" y="352" width="205" height="48" rx="9" fill="#ffffff"/><text x="655" y="381" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#24344d">Fit adjustable parameters</text><rect x="644" y="412" width="205" height="48" rx="9" fill="#ffffff"/><text x="655" y="441" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#24344d">Assess validation results</text><rect x="921" y="162" width="235" height="328" rx="20" fill="#f3effc" stroke="#6b549b" stroke-width="2"/><text x="937" y="198" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#6b549b">STEP 4 · EVALUATE</text><text x="937" y="253" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#24344d">New observations</text><rect x="936" y="292" width="205" height="48" rx="9" fill="#ffffff"/><text x="947" y="321" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#24344d">Held-out predictions</text><rect x="936" y="352" width="205" height="48" rx="9" fill="#ffffff"/><text x="947" y="381" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#24344d">Check errors and bias</text><rect x="936" y="412" width="205" height="48" rx="9" fill="#ffffff"/><text x="947" y="441" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#24344d">Interpret limits</text><path d="M287 319 L327 319" fill="none" stroke="#6a8299" stroke-width="4" stroke-linecap="round"/><path d="M315.9 325.8 L327 319 L315.9 312.2" fill="none" stroke="#6a8299" stroke-width="4" stroke-linejoin="round"/><path d="M579 319 L619 319" fill="none" stroke="#6a8299" stroke-width="4" stroke-linecap="round"/><path d="M607.9 325.8 L619 319 L607.9 312.2" fill="none" stroke="#6a8299" stroke-width="4" stroke-linejoin="round"/><path d="M871 319 L911 319" fill="none" stroke="#6a8299" stroke-width="4" stroke-linecap="round"/><path d="M899.9 325.8 L911 319 L899.9 312.2" fill="none" stroke="#6a8299" stroke-width="4" stroke-linejoin="round"/><rect x="88" y="530" width="1024" height="92" rx="18" fill="#f6f8fa" stroke="#dce3eb" stroke-width="1"/><text x="600" y="565" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#245e98" text-anchor="middle">CONCEPTUAL BRIDGE</text><text x="600" y="594" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#24344d" text-anchor="middle">Article 1 described existing measurements. Article 2 asks whether a model can learn a defined task.</text><text x="600" y="650" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#5d6c81" text-anchor="middle">Schematic teaching workflow · No NHANES model has been fitted here</text></svg>