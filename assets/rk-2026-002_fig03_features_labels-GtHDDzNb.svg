ize="13" font-weight="700" fill="#245e98">FEATURE</text><text x="641" y="239" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#24344d">Area</text><text x="641" y="264" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#5d6c81">A measured geometric characteristic</text><rect x="523" y="289" width="610" height="68" rx="12" fill="#fff"/><text x="539" y="314" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#245e98">FEATURE</text><text x="641" y="317" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#24344d">Perimeter</text><text x="641" y="342" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#5d6c81">Length of the bean boundary</text><rect x="523" y="367" width="610" height="68" rx="12" fill="#fff"/><text x="539" y="392" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#245e98">FEATURE</text><text x="641" y="395" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#24344d">MajorAxisLength</text><text x="641" y="420" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#5d6c81">Length-related shape measurement</text><rect x="523" y="445" width="610" height="68" rx="12" fill="#fff"/><text x="539" y="470" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#a76a13">LABEL</text><text x="641" y="473" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#24344d">Class</text><text x="641" y="498" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#5d6c81">Known variety: reference category</text><rect x="65" y="584" width="1070" height="53" rx="12" fill="#f6f8fa" stroke="#dce3eb" stroke-width="1"/><text x="600" y="617" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#24344d" text-anchor="middle">Features = model inputs  ·  Class = supervised-learning target</text><text x="600" y="661" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#5d6c81" text-anchor="middle">The figure does not display a particular participant, bean record, or predicted class.</text></svg>