<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img"><rect x="0" y="0" width="1200" height="680" rx="24" fill="#ffffff"/><text x="600" y="64" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#24344d" text-anchor="middle">SAME SOURCE DATA · THREE DIFFERENT QUESTIONS</text><text x="600" y="103" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#5d6c81" text-anchor="middle">Task type depends on the required output, not merely on which dataset is opened.</text><rect x="42" y="157" width="337" height="411" rx="23" fill="#eaf3fb" stroke="#245e98" stroke-width="2"/><text x="62" y="200" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#245e98">01 · CLASSIFICATION</text><text x="62" y="264" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#24344d">Predict a category</text><text x="62" y="317" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#24344d">Which bean variety?</text><rect x="61" y="357" width="299" height="78" rx="13" fill="#fff"/><text x="74" y="385" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#245e98">OUTPUT</text><text x="74" y="415" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#24344d">SEKER / DERMASON / ...</text><text x="64" y="493" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#5d6c81">Supervised: uses known classes</text><text x="64" y="529" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#24344d">One of the defined varieties</text><rect x="432" y="157" width="337" height="411" rx="23" fill="#eaf8f3" stroke="#17766d" stroke-width="2"/><text x="452" y="200" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#17766d">02 · REGRESSION</text><text x="452" y="264" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#24344d">Estimate a number</text><text x="452" y="317" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#24344d">How large is a shape measure?</text><rect x="451" y="357" width="299" height="78" rx="13" fill="#fff"/><text x="464" y="385" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#17766d">OUTPUT</text><text x="464" y="415" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#24344d">A continuous estimate</text><text x="454" y="493" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#5d6c81">Supervised: uses numerical targets</text><text x="454" y="529" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#24344d">No value claimed here</text><rect x="822" y="157" width="337" height="411" rx="23" fill="#f3effc" stroke="#6b549b" stroke-width="2"/><text x="842" y="200" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#6b549b">03 · CLUSTERING</text><text x="842" y="264" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#24344d">Discover groups</text><text x="842" y="317" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#24344d">Which shapes are similar?</text><rect x="841" y="357" width="299" height="78" rx="13" fill="#fff"/><text x="854" y="385" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#6b549b">OUTPUT</text><text x="854" y="415" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#24344d">Group A / B / C / ...</text><text x="844" y="493" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#5d6c81">Unsupervised: hides class labels</text><text x="844" y="529" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#24344d">Not necessarily known varieties</text><text x="600" y="611" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#24344d" text-anchor="middle">Clustering groups are determined by an algorithm and need not match registered varieties.</text><text x="600" y="650" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#5d6c81" text-anchor="middle">Schematic questions only; no classifier accuracy, regression error, or cluster quality is presented.</text></svg>