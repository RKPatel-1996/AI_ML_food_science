<svg xmlns="http://www.w3.org/2000/svg"
 viewBox="0 0 1320 730" role="img">
<title>Measurement coverage across linked NHANES files</title>
<desc>Observed, missing and component-unavailable measurements for 9,254 public-use NHANES demographic participants.</desc>
<style>
text {
 font-family: Lexend, "Segoe UI", Arial, sans-serif;
}
</style>
<rect x="0" y="0" width="1320" height="730" rx="22" fill="#fffdfd" stroke="none"/>
<text x="54" y="66" fill="#302830" font-size="29" font-weight="700" text-anchor="start">Not every participant has every measurement</text><text x="54" y="105" fill="#685e68" font-size="17" font-weight="400" text-anchor="start">CDC NHANES 2017-2018 | linked by participant identifier</text><rect x="54" y="133" width="19" height="19" rx="4" fill="#98536e" stroke="none"/><text x="81" y="149" fill="#685e68" font-size="15" font-weight="400" text-anchor="start">Observed</text><rect x="394" y="133" width="19" height="19" rx="4" fill="#e6b2c6" stroke="none"/><text x="421" y="149" fill="#685e68" font-size="15" font-weight="400" text-anchor="start">In component, value missing</text><rect x="734" y="133" width="19" height="19" rx="4" fill="#e8ebf0" stroke="none"/><text x="761" y="149" fill="#685e68" font-size="15" font-weight="400" text-anchor="start">No component record</text><text x="54" y="235" fill="#302830" font-size="18" font-weight="600" text-anchor="start">Age</text><rect x="310" y="207" width="795.0" height="41" rx="0" fill="#98536e" stroke="none"/><text x="1130" y="235" fill="#302830" font-size="17" font-weight="600" text-anchor="start">9,254 observed</text><text x="54" y="328" fill="#302830" font-size="18" font-weight="600" text-anchor="start">BMI</text><rect x="310" y="300" width="687.7" height="41" rx="0" fill="#98536e" stroke="none"/><rect x="997.7" y="300" width="60.05" height="41" rx="0" fill="#e6b2c6" stroke="none"/><rect x="1057.75" y="300" width="47.25" height="41" rx="0" fill="#e8ebf0" stroke="none"/><text x="1130" y="328" fill="#302830" font-size="17" font-weight="600" text-anchor="start">8,005 observed</text><text x="54" y="421" fill="#302830" font-size="18" font-weight="600" text-anchor="start">Day-1 dietary energy</text><rect x="310" y="393" width="642.94" height="41" rx="0" fill="#98536e" stroke="none"/><rect x="952.94" y="393" width="104.81" height="41" rx="0" fill="#e6b2c6" stroke="none"/><rect x="1057.75" y="393" width="47.25" height="41" rx="0" fill="#e8ebf0" stroke="none"/><text x="1130" y="421" fill="#302830" font-size="17" font-weight="600" text-anchor="start">7,484 observed</text><text x="54" y="514" fill="#302830" font-size="18" font-weight="600" text-anchor="start">Fasting glucose</text><rect x="310" y="486" width="248.36" height="41" rx="0" fill="#98536e" stroke="none"/><rect x="558.36" y="486" width="12.46" height="41" rx="0" fill="#e6b2c6" stroke="none"/><rect x="570.82" y="486" width="534.18" height="41" rx="0" fill="#e8ebf0" stroke="none"/><text x="1130" y="514" fill="#302830" font-size="17" font-weight="600" text-anchor="start">2,891 observed</text><rect x="54" y="588" width="1200" height="70" rx="12" fill="#fff6f8" stroke="#eadde2"/><text x="75" y="615" fill="#685e68" font-size="18" font-weight="400" text-anchor="start">All four measurements observed together:</text><text x="75" y="644" fill="#98536e" font-size="22" font-weight="700" text-anchor="start">2,614 of 9,254 demographic participants</text><text x="54" y="701" fill="#685e68" font-size="15" font-weight="400" text-anchor="start">Unweighted counts. Component availability reflects eligibility and sampling, not just missing data.</text>
</svg>