<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="458" viewBox="0 0 1280 458" role="img"><rect width="1280" height="458" rx="22" fill="#f8fafc"/> <text x="46" y="55" font-family="Arial,Helvetica,sans-serif" font-size="29" fill="#20364c" font-weight="700" text-anchor="start">NUTRIENT CALCULATION REQUIRES TWO VALID INPUTS</text><rect x="46" y="111" width="350" height="194" rx="18" fill="#eaf0f7" stroke="#d8e2ec" stroke-width="2"/><text x="70" y="153" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#117b78" font-weight="700" text-anchor="start">INPUT 1</text><text x="70" y="201" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#20364c" font-weight="700" text-anchor="start">Edible amount</text><text x="70" y="245" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#556575" font-weight="400" text-anchor="start">grams consumed</text><text x="435" y="227" font-family="Arial,Helvetica,sans-serif" font-size="53" fill="#117b78" font-weight="700" text-anchor="middle">×</text><rect x="478" y="111" width="350" height="194" rx="18" fill="#e8f5f2" stroke="#d8e2ec" stroke-width="2"/><text x="502" y="153" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#117b78" font-weight="700" text-anchor="start">INPUT 2</text><text x="502" y="201" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#20364c" font-weight="700" text-anchor="start">Nutrient value</text><text x="502" y="245" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#556575" font-weight="400" text-anchor="start">grams per 100 grams</text><text x="867" y="227" font-family="Arial,Helvetica,sans-serif" font-size="39" fill="#117b78" font-weight="700" text-anchor="start">÷ 100</text><rect x="976" y="111" width="258" height="194" rx="18" fill="#fbede7" stroke="#d8e2ec" stroke-width="2"/><text x="997" y="153" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#ad6023" font-weight="700" text-anchor="start">ESTIMATE</text><text x="997" y="201" font-family="Arial,Helvetica,sans-serif" font-size="29" fill="#20364c" font-weight="700" text-anchor="start">Nutrient</text><text x="997" y="237" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#20364c" font-weight="700" text-anchor="start">amount (g)</text><rect x="45" y="337" width="1189" height="79" rx="14" fill="#ffffff" stroke="#d8e2ec" stroke-width="2"/><text x="68" y="369" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#20364c" font-weight="700" text-anchor="start">Before multiplying:</text><text x="264" y="369" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#556575" font-weight="400" text-anchor="start">verify food identity, recipe, cooking state, edible fraction and units.</text><text x="68" y="398" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#ad6023" font-weight="700" text-anchor="start">A correct calculation is not proof that the recorded intake was correct.</text></svg>