<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img"><rect x="0" y="0" width="1200" height="680" rx="24" fill="#ffffff"/><text x="600" y="64" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="#24344d" text-anchor="middle">TRAINING IS NOT THE SAME AS TESTING</text><text x="600" y="104" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#5d6c81" text-anchor="middle">Keep evaluation examples separate from the examples used to fit the model.</text><rect x="50" y="171" width="1100" height="117" rx="18" fill="#eaf3fb" stroke="#245e98" stroke-width="2"/><text x="600" y="207" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#245e98" text-anchor="middle">DOCUMENTED DATASET</text><text x="600" y="247" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="500" fill="#24344d" text-anchor="middle">Check labels, units, missing data, duplicates, and sampling before splitting</text><path d="M600 292 L600 335" fill="none" stroke="#6a8299" stroke-width="4" stroke-linecap="round"/><path d="M593.2 323.9 L600 335 L606.8 323.9" fill="none" stroke="#6a8299" stroke-width="4" stroke-linejoin="round"/><rect x="53" y="347" width="320" height="199" rx="18" fill="#eaf8f3" stroke="#17766d" stroke-width="2"/><text x="71" y="388" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#17766d">TRAINING DATA</text><text x="71" y="435" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#24344d">Fit model parameters</text><text x="71" y="482" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#5d6c81">Learns from known examples</text><rect x="444" y="347" width="320" height="199" rx="18" fill="#fff6e7" stroke="#a76a13" stroke-width="2"/><text x="462" y="388" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#a76a13">VALIDATION DATA</text><text x="462" y="435" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#24344d">Choose and refine settings</text><text x="462" y="482" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#5d6c81">Compare candidate models</text><rect x="835" y="347" width="320" height="199" rx="18" fill="#f3effc" stroke="#6b549b" stroke-width="2"/><text x="853" y="388" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#6b549b">HELD-OUT TEST DATA</text><text x="853" y="435" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#24344d">Final, independent evaluation</text><text x="853" y="482" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#5d6c81">Estimate generalization error</text><rect x="72" y="585" width="1056" height="51" rx="12" fill="#f6f8fa" stroke="#dce3eb" stroke-width="1"/><text x="600" y="616" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" fill="#24344d" text-anchor="middle">Do not use final test results repeatedly to redesign the model.</text><text x="600" y="660" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#5d6c81" text-anchor="middle">Schematic split: no proportions or model performance values are claimed.</text></svg>